<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Alpha Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game canvas -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Crosshair -->
    <div id="crosshair"></div>
    
    <!-- UI Overlay -->
    <div id="ui">
        <div id="controls" class="panel">
            <h3>Controls</h3>
            <ul>
                <li><strong>WASD</strong> - Move</li>
                <li><strong>Mouse</strong> - Look around</li>
                <li><strong>Space</strong> - Jump</li>
                <li><strong>Left Click</strong> - Break block</li>
                <li><strong>Right Click</strong> - Place block</li>
                <li><strong>ESC</strong> - Release mouse</li>
            </ul>
        </div>
        
        <div id="info" class="panel">
            <div id="fps">FPS: 0</div>
            <div id="position">Position: (0, 0, 0)</div>
            <div id="currentBlock">Current Block: Dirt</div>
        </div>
        
        <div id="clickPrompt">
            Click to start
        </div>
    </div>
    
    <!-- Game scripts as ES6 modules -->
    <script type="module" src="game.js"></script>
</body>
</html>
